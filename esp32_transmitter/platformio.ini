; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = espidf
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
monitor_echo = yes
monitor_filters = direct
extra_scripts = fix_intellisense.py

;also change the image name here.
;we place all the images into the flash memory.
board_build.embed_files = 
    src/images/frame1.jpg
    src/images/frame2.jpg
    src/images/frame3.jpg
    src/images/frame4.jpg
    src/images/frame5.jpg
    src/images/frame6.jpg
    src/images/frame7.jpg
    src/images/frame8.jpg
    src/images/frame9.jpg
    src/images/frame10.jpg
    src/images/frame11.jpg
    src/images/frame12.jpg
    src/images/frame13.jpg
    src/images/frame14.jpg
    src/images/frame15.jpg
    src/images/left.jpg
    src/images/leftright.jpg
    src/images/linkedin.jpg
    src/images/github.jpg
    src/images/blankfirstpage.jpg
    src/images/secondpagedata.jpg
    src/images/autofirst.jpg
    src/images/autofirststop.jpg
board_build.partitions = partitions.csv












